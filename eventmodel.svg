<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -24 2270 306" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#558B2F"/>
    </marker>
  </defs>

  <!-- ===== time markers ===== -->
  <text x="580" y="-8" font-size="11" text-anchor="middle" fill="#666666">1</text>
  <text x="840" y="162" font-size="11" text-anchor="middle" fill="#666666">2</text>
  <text x="1100" y="-8" font-size="11" text-anchor="middle" fill="#666666">3</text>
  <text x="1360" y="-8" font-size="11" text-anchor="middle" fill="#666666">4</text>

  <!-- ===== People ===== -->
  <g data-id="Customer">
    <rect x="40" y="8" width="110" height="64" fill="#F9A8C3" stroke="#BE185D" stroke-width="2"/>
    <text x="95" y="40" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#4A0E2E">Customer</text>
  </g>
  <g data-id="Warehouse">
    <rect x="40" y="188" width="110" height="64" fill="#F9A8C3" stroke="#BE185D" stroke-width="2"/>
    <text x="95" y="220" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#4A0E2E">Warehouse</text>
  </g>

  <!-- ===== Commands ===== -->
  <g data-id="create-order">
    <rect x="210" y="8" width="200" height="64" fill="#9CCC65" stroke="#558B2F" stroke-width="2"/>
    <text x="310" y="40" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1B3A08">Create Order</text>
  </g>
  <g data-id="cancel-order">
    <rect x="210" y="82" width="200" height="64" fill="#9CCC65" stroke="#558B2F" stroke-width="2"/>
    <text x="310" y="114" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1B3A08">Cancel Order</text>
  </g>
  <g data-id="mark-order-shipped">
    <rect x="210" y="156" width="200" height="64" fill="#9CCC65" stroke="#558B2F" stroke-width="2"/>
    <text x="310" y="188" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1B3A08">Mark Order Shipped</text>
  </g>

  <!-- ===== Events ===== -->
  <g data-id="order-created">
    <rect x="470" y="8" width="220" height="64" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
    <text x="580" y="40" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#3E2723">Order Created</text>
  </g>
  <g data-id="inventory-reserved">
    <rect x="730" y="178" width="220" height="64" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
    <text x="840" y="210" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#3E2723">Inventory Reserved</text>
  </g>
  <g data-id="order-shipped">
    <rect x="990" y="8" width="220" height="64" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
    <text x="1100" y="40" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#3E2723">Order Shipped</text>
  </g>
  <g data-id="order-cancelled">
    <rect x="1250" y="8" width="220" height="64" fill="#FFB74D" stroke="#E65100" stroke-width="2"/>
    <text x="1360" y="40" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#3E2723">Order Cancelled</text>
  </g>

  <!-- ===== Read models ===== -->
  <g data-id="order-list">
    <rect x="1770" y="40" width="200" height="64" fill="#B39DDB" stroke="#5E35B1" stroke-width="2"/>
    <text x="1870" y="72" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#311B92">Order List</text>
  </g>
  <g data-id="stock-levels">
    <rect x="2030" y="210" width="200" height="64" fill="#B39DDB" stroke="#5E35B1" stroke-width="2"/>
    <text x="2130" y="242" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#311B92">Stock Levels</text>
  </g>

  <!-- ===== Edges ===== -->
  <!-- Actor -> Command -->
  <line data-from="Customer" data-to="create-order" x1="150" y1="40" x2="210" y2="40" stroke="#666" stroke-width="2" stroke-dasharray="6,4"/>
  <line data-from="Customer" data-to="cancel-order" x1="150" y1="40" x2="210" y2="114" stroke="#666" stroke-width="2" stroke-dasharray="6,4"/>
  <line data-from="Warehouse" data-to="mark-order-shipped" x1="150" y1="220" x2="210" y2="188" stroke="#666" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Command -> Event -->
  <line data-from="create-order" data-to="order-created" x1="410" y1="40" x2="470" y2="40" stroke="#558B2F" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line data-from="mark-order-shipped" data-to="order-shipped" x1="410" y1="188" x2="990" y2="40" stroke="#558B2F" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line data-from="cancel-order" data-to="order-cancelled" x1="410" y1="114" x2="1250" y2="40" stroke="#558B2F" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Event -> Read model (orthogonal) -->
  <polyline data-from="order-created" data-to="order-list" points="690,40 770,40 770,72 1770,72" fill="none" stroke="#5E35B1" stroke-width="2"/>
  <polyline data-from="order-shipped" data-to="order-list" points="1210,40 1290,40 1290,72 1770,72" fill="none" stroke="#5E35B1" stroke-width="2"/>
  <polyline data-from="order-cancelled" data-to="order-list" points="1470,40 1550,40 1550,72 1770,72" fill="none" stroke="#5E35B1" stroke-width="2"/>
  <polyline data-from="inventory-reserved" data-to="stock-levels" points="950,210 1030,210 1030,242 2030,242" fill="none" stroke="#5E35B1" stroke-width="2"/>
</svg>